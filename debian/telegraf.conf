# Base Telegraf config of telegraf-light, copied to /etc/telegraf/telegraf.conf
# on the first install. Inputs come from /etc/telegraf/telegraf.d/
# (on NaPi: symlinks managed by napi-api, Sensors page of the web UI).
# INFLUX_TOKEN is set in /etc/default/telegraf.
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "napi"
  bucket = "sensors"
